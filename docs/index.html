<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HY兔">
<meta name="theme-color" content="#FBF7F2">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<title>HY兔</title>
<style>
  :root{
    --paper:#FBF7F2; --paper2:#F7F0E9; --card:#FFFDFC;
    --ink:#4A4441; --ink2:#8C817A; --ink3:#B5A99E; --ink4:#D4C9BE;
    --line:#EEE5DB; --line2:#DFD2C4;
    --coral:#E8907C; --coral2:#F9D8CE; --lilac:#C6B8E4; --lilac2:#EDE7F8;
    --mint:#A4D2C8; --sky:#A9C6DE; --rose:#EDA9AE; --sand:#F0D28E;
    --sh:0 1px 2px rgba(150,125,110,.05), 0 10px 26px rgba(150,125,110,.07);
    --shs:0 1px 2px rgba(150,125,110,.05), 0 4px 14px rgba(150,125,110,.06);
    --sans:"Microsoft YaHei UI","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
    --round:"YouYuan","Yuanti SC","Microsoft YaHei UI","PingFang SC",sans-serif;
    --fs:16px; --fh:2.0; --fcol:#4A4441; --ffam:var(--sans);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
  body{background-color:var(--paper);
    background-image:radial-gradient(circle at 1px 1px, rgba(196,176,160,.16) 1px, transparent 0);
    background-size:17px 17px;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.7;overflow:hidden}
  button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;outline:none}
  select{cursor:pointer}
  select.inp{background:#FCF8F4 url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%23B5A99E'/%3E%3C/svg%3E") no-repeat right 12px center;
    padding-right:30px;appearance:none;-webkit-appearance:none}
  .li .go{color:var(--coral)}
  button{cursor:pointer}
  .wrap{height:100%;display:flex;flex-direction:column}
  /* ---------- 顶栏 ---------- */
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#FCF6F0,#F8F1E9);flex:none}
  header .back{font-size:19px;line-height:1;padding:4px 8px;border-radius:10px;color:var(--ink2);display:none}
  body.inmod header .back{display:block}
  header h1{margin:0;flex:1;font-family:var(--round);font-size:17px;font-weight:500;letter-spacing:.1em;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header h1:after{content:"";display:block;width:24px;height:3px;border-radius:3px;background:var(--coral);opacity:.6;margin-top:5px}
  .pill{display:inline-flex;align-items:center;gap:6px;flex:none;font-size:12px;padding:5px 11px;border-radius:999px;
    border:1.5px solid var(--line);background:var(--card);color:var(--ink2)}
  .pill i{width:7px;height:7px;border-radius:50%;background:var(--ink4);display:block}
  .pill.ok i{background:var(--mint)} .pill.busy i{background:var(--sand)} .pill.err i{background:var(--rose)}
  .pill.ai i{background:var(--lilac)}
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative}
  /* ---------- 首页宫格 ---------- */
  #home{padding:18px 16px 60px;display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  @media(min-width:640px){#home{grid-template-columns:repeat(3,1fr)}}
  @media(min-width:900px){#home{grid-template-columns:repeat(4,1fr);gap:18px;padding:26px 28px 60px}}
  .mod{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:18px 16px 16px;
    box-shadow:var(--shs);text-align:left;display:flex;flex-direction:column;gap:10px;transition:.16s}
  .mod:active{transform:scale(.98)}
  .mod svg{width:38px;height:38px;color:var(--c)}
  .mod .nm{font-family:var(--round);font-size:16px;letter-spacing:.06em;color:var(--ink)}
  .mod .ds{font-size:11.5px;color:var(--ink3);line-height:1.5}
  /* ---------- 通用 ---------- */
  .sect{padding:16px 16px 80px;max-width:980px;margin:0 auto}
  .card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;box-shadow:var(--shs);padding:14px 16px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{border:1.5px solid var(--line);border-radius:999px;background:var(--card);padding:7px 14px;color:var(--ink2);font-size:13px}
  .btn:hover{border-color:var(--line2);color:var(--ink)}
  .btn.pri{border-color:transparent;background:var(--coral2);color:#8C4A38;font-weight:500}
  .btn.sm{padding:5px 11px;font-size:12px}
  .lbl{font-size:11.5px;color:var(--ink3);letter-spacing:.06em;margin:12px 0 6px}
  .inp{width:100%;border:1.5px solid var(--line);border-radius:12px;background:#FCF8F4;padding:9px 12px;font-size:14px;color:var(--ink)}
  .inp:focus{border-color:var(--lilac)}
  select.inp{appearance:none}
  textarea.inp{resize:vertical;line-height:1.8;min-height:64px}
  .ti{font-family:var(--round);font-size:15px;color:var(--ink);letter-spacing:.05em}
  .mu{font-size:11.5px;color:var(--ink3)}
  .hr{border:0;border-top:1px solid var(--line);margin:14px 0}
  .empty{color:var(--ink3);font-size:13px;text-align:center;padding:30px 10px}
  .tag{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--ink3)}
  /* ---------- 幕次条 ---------- */
  .acts{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--line);
    background:var(--paper2);-webkit-overflow-scrolling:touch}
  .acts button{flex:none;font-size:12.5px;padding:6px 13px;border-radius:999px;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink2);white-space:nowrap}
  .acts button.on{background:var(--lilac2);border-color:var(--lilac);color:#6A5A96;font-weight:500}
  /* ---------- 写作区 ---------- */
  #sheet{position:relative;padding:14px;min-height:100%}
  .paper{position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--sh);
    padding:22px 18px 60px;max-width:820px;margin:0 auto}
  .rules{position:absolute;inset:0;pointer-events:none;z-index:0}
  .fld{position:relative;z-index:1;margin-bottom:16px}
  .fld > .h{display:flex;align-items:center;gap:8px;margin-bottom:5px}
  .fld > .h .n{font-size:12px;color:#8A7F76;letter-spacing:.08em}
  .fld > .h button{font-size:11px;color:#B0A69A}
  .fld textarea{width:100%;background:transparent;border:0;border-bottom:1px dashed rgba(140,126,112,.28);
    padding:4px 2px;resize:none;overflow:hidden;font-family:var(--ffam);font-size:var(--fs);
    line-height:var(--fh);color:var(--fcol)}
  .fld textarea.big{min-height:46vh}
  .fld.small textarea{min-height:34px}
  .fld textarea:focus{border-bottom-color:var(--coral)}
  /* ---------- 关系图 ---------- */
  .gwrap{border:1.5px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--shs);overflow:hidden}
  .gwrap{position:relative}
  .gwrap svg{display:block;width:100%;height:auto;touch-action:none}
  .gzoom{position:absolute;right:10px;top:10px;z-index:3;display:flex;flex-direction:column;gap:6px}
  .gzoom button{width:38px;height:38px;border-radius:12px;border:1.5px solid var(--line);
    background:rgba(255,253,252,.94);color:var(--ink2);font-size:17px;line-height:1;box-shadow:var(--shs)}
  .gn{font-size:13px;fill:#4A4441;font-family:var(--sans)}
  .gl{font-size:10px;fill:#9A9089;paint-order:stroke;stroke:#FFFDFC;stroke-width:3px;stroke-linejoin:round}
  /* ---------- 弹层 ---------- */
  .sheet-mask{position:fixed;inset:0;background:rgba(92,78,68,.26);z-index:60;display:none}
  .sheet-mask.on{display:block}
  body.sheeton #mask{display:block}
  .sheet-box{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--card);
    border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(120,100,85,.2);max-height:88vh;
    overflow-y:auto;padding:20px 18px 26px;transform:translateY(102%);transition:transform .24s;
    max-width:760px;margin:0 auto}
  body.sheeton #sheet{transform:none;opacity:1;pointer-events:auto;visibility:visible}
  .sheet-box h3{margin:0 0 12px;font-family:var(--round);font-size:16px;letter-spacing:.06em}
  .sheet-box h3:after{content:"";display:block;width:24px;height:3px;border-radius:3px;background:var(--lilac);opacity:.6;margin-top:6px}
  @media(min-width:760px){
    .sheet-box{left:50%;right:auto;bottom:auto;top:50%;width:520px;border-radius:20px;max-height:80vh;
      transform:translate(-50%,-45%);opacity:0;pointer-events:none;transition:transform .2s,opacity .2s}
    body.sheeton #sheet{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  }
  /* ===== 全屏编辑页（所有文本编辑都走这里） ===== */
  #edit{position:fixed;inset:0;z-index:70;background:var(--paper);display:none;flex-direction:column}
  body.editing #edit{display:flex}
  .ehead{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#FCF6F0,#F8F1E9);flex:none}
  .ehead button{font-size:19px;line-height:1;padding:4px 8px;border-radius:10px;color:var(--ink2)}
  .ehead h2{margin:0;flex:1;font-family:var(--round);font-size:16px;font-weight:500;letter-spacing:.05em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ebody{flex:1;overflow-y:auto;padding:14px 14px 60px;-webkit-overflow-scrolling:touch}
  .earea{max-width:920px;margin:0 auto}
  .ebar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .ebar select,.ebar input[type=color],.ebar input[type=number]{border:1.5px solid var(--line);
    border-radius:10px;background:var(--card);padding:6px 10px;font-size:12.5px;color:var(--ink2)}
  .ebar input[type=color]{width:48px;height:34px;padding:3px}
  .ebar .lb{font-size:11px;color:var(--ink3)}
  .ebtn{border:1.5px solid var(--line);border-radius:999px;background:var(--card);padding:5px 12px;
    font-size:12.5px;color:var(--ink2)}
  .ebtn:hover{border-color:var(--line2);color:var(--ink)}
  .ebtn.on{background:var(--lilac2);border-color:var(--lilac);color:#6A5A96}
  .ebtn.b{font-weight:700;padding:5px 14px}
  .epaper{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
    box-shadow:var(--shs);overflow:hidden;margin-bottom:14px}
  .erule{position:absolute;inset:0;pointer-events:none}
  .edit2{position:relative;z-index:1;padding:20px 22px;min-height:56vh;outline:none;
    font-family:var(--efam,var(--sans));font-size:var(--efs,16px);line-height:var(--efh,1.95);
    color:var(--efcol,#4A4441);white-space:pre-wrap;word-break:break-word}
  .edit2.sm{min-height:140px}
  .edit2:empty:before{content:attr(data-ph);color:#C9BFB2}
  .pv{max-height:8.4em;overflow:hidden}
  .sw{width:24px;height:24px;border-radius:7px;border:1.5px solid rgba(0,0,0,.10);flex:none}
  .sw.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--coral)}
  .cbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .szbtn{padding:4px 9px;font-size:13px;line-height:1}
  .rbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 12px;margin-bottom:10px;
    background:var(--paper2);border:1.5px solid var(--line);border-radius:12px}
  .rbar select,.rbar input[type=color]{border:1.5px solid var(--line);border-radius:9px;background:var(--card);
    padding:5px 9px;font-size:12.5px;color:var(--ink2)}
  .rbar input[type=color]{width:42px;height:30px;padding:2px}
  .rbar input[type=range]{width:92px}
  .rbar .lb{font-size:11px;color:var(--ink3)}
  .earea textarea{width:100%;min-height:58vh;background:var(--card);border:1.5px solid var(--line);
    border-radius:14px;padding:18px 20px;box-shadow:var(--shs);resize:vertical;
    font-family:var(--efam,var(--sans));font-size:var(--efs,16px);line-height:var(--efh,1.95);color:var(--efcol,#4A4441)}
  .earea textarea.sm{min-height:120px}
  /* ===== 列表行 ===== */
  .li{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);
    border-radius:14px;box-shadow:var(--shs);padding:14px 16px;margin-bottom:10px;width:100%;text-align:left}
  .li .t{flex:1;min-width:0;font-size:14.5px}
  .li .s{display:block;font-size:11.5px;color:var(--ink3);margin-top:4px;line-height:1.55}
  .li .go{color:var(--ink4);font-size:16px;flex:none}
  .sechead{display:flex;align-items:center;gap:10px;margin:16px 0 10px}
  .sechead .n{font-family:var(--round);font-size:15px;letter-spacing:.05em}
  .sechead .l{flex:1;height:1px;background:var(--line)}
  /* ===== 关系图工作区 ===== */
  .gwork{display:flex;gap:14px;align-items:flex-start}
  .gside{width:214px;flex:none;background:var(--card);border:1.5px solid var(--line);border-radius:16px;
    box-shadow:var(--shs);padding:12px;max-height:70vh;overflow-y:auto}
  .gside .gp{font-size:11px;color:var(--ink3);letter-spacing:.08em;margin:10px 0 5px}
  .gside label{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:4px 2px;cursor:pointer}
  .gside input[type=checkbox]{width:15px;height:15px}
  .gmain{flex:1;min-width:0}
  @media(max-width:820px){
    .gwork{flex-direction:column}
    .gside{width:100%;max-height:230px}
    .gwrap{height:68vh}
    .gwrap svg{width:100%;height:100%}
  }
  .gnode{cursor:grab}
  .gnode.drag{cursor:grabbing}
  /* ---------- AI ---------- */
  #aiMask{position:fixed;inset:0;background:rgba(92,78,68,.16);z-index:44;opacity:0;pointer-events:none;transition:.22s}
  body.aion #aiMask{opacity:1;pointer-events:auto}
  #ai{position:fixed;top:0;right:0;bottom:0;width:420px;max-width:94vw;z-index:46;background:var(--card);
    box-shadow:-10px 0 40px rgba(150,125,110,.16);transform:translateX(102%);transition:transform .26s;
    display:flex;flex-direction:column}
  body.aion #ai{transform:none}
  @media(max-width:820px){
    #ai{top:auto;left:0;bottom:0;width:100%;max-width:100%;height:82vh;border-radius:22px 22px 0 0;
      box-shadow:0 -10px 40px rgba(150,125,110,.2);transform:translateY(102%)}
  }
  .aihead{display:flex;align-items:center;gap:8px;padding:13px 15px;border-bottom:1px solid var(--line)}
  .aihead h3{margin:0;flex:1;font-family:var(--round);font-size:15px}
  .aihead button{font-size:12px;color:var(--ink3);padding:5px 10px;border-radius:999px;border:1.5px solid var(--line)}
  #aiLog{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
  .msg{max-width:92%;margin:0 0 12px;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.75;
    white-space:pre-wrap;word-break:break-word}
  .msg.u{margin-left:auto;background:var(--lilac2);color:#584A7C;border-bottom-right-radius:5px}
  .msg.a{background:#F7F1EA;color:var(--ink);border-bottom-left-radius:5px}
  .msg em{font-style:normal;color:var(--coral);font-weight:500}
  .aifoot{border-top:1px solid var(--line);padding:10px 12px 14px}
  .aichips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
  .aichips button{flex:none;font-size:11.5px;padding:5px 11px;border-radius:999px;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink2);white-space:nowrap}
  .aiinput{display:flex;gap:8px;align-items:flex-end}
  .aiinput textarea{flex:1;border:1.5px solid var(--line);border-radius:14px;background:#FCF8F4;padding:9px 12px;
    font-size:13.5px;resize:none;max-height:130px;min-height:42px}
  .aiinput textarea:focus{border-color:var(--lilac)}
  #aiSend{border-radius:14px;padding:11px 16px;background:#7C6BA8;color:#fff;font-size:13px}
  #aiSend:disabled{opacity:.4}
  /* ---------- 滚动条 ---------- */
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#E4D9CC;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" id="back">←</button>
    <h1 id="title">HY兔</h1>
    <button class="pill" id="syncPill"><i></i><span>同步</span></button>
    <button class="pill ai" id="aiBtn"><i></i><span>AI</span></button>
  </header>
  <main id="view"></main>
</div>

<div id="aiMask"></div>
<aside id="ai">
  <div class="aihead">
    <h3>创作顾问</h3>
    <button id="aiCfgBtn">设置</button>
    <button id="aiClose">收起</button>
  </div>
  <div id="aiCfg" class="sect" style="display:none;padding:0 15px 14px">
    <div class="lbl">接入方式</div>
    <select class="inp" id="aiMode">
      <option value="direct">浏览器直连（推荐）</option>
      <option value="proxy">走自建接口</option>
    </select>
    <div id="aiProxyBox" style="display:none">
      <div class="lbl">接口地址</div>
      <input class="inp" id="aiProxy" placeholder="https://xxx.workers.dev">
    </div>
    <div id="aiDirectBox">
      <div class="lbl">接口地址</div>
      <input class="inp" id="aiBase" placeholder="https://open.bigmodel.cn/api/paas/v4">
      <div class="lbl">API Key</div>
      <input class="inp" id="aiKey" placeholder="粘贴你的密钥">
      <div class="lbl">模型名</div>
      <input class="inp" id="aiModel" placeholder="glm-4-flash">
    </div>
    <div class="lbl">上下文</div>
    <select class="inp" id="aiCtx">
      <option value="on">带上当前内容（推荐）</option>
      <option value="off">不带</option>
    </select>
    <div class="row" style="margin-top:14px">
      <button class="btn pri" id="aiSave">保存</button>
      <button class="btn" id="aiClear">清空对话</button>
    </div>
  </div>
  <div id="aiLog"></div>
  <div class="aifoot">
    <div class="aichips">
      <button data-p="陪我想这一段的情节走向，只提问，不要替我写。">想情节</button>
      <button data-p="适合用什么典故或真实史料？给出可考出处，并标注史实与演绎。">找典故</button>
      <button data-p="这个人物此刻的心理，有哪些实证心理学理论能解释？区分实证与精神分析。">心理学</button>
      <button data-p="帮我压测这段设定，找出会被玩家拆穿的逻辑漏洞，要有依据。">压测逻辑</button>
      <button data-p="这段文字读起来像人话吗？指出堆砌和套话，不要重写。">挑文笔</button>
    </div>
    <div class="aiinput">
      <textarea id="aiIn" rows="1" placeholder="说说你卡在哪…"></textarea>
      <button id="aiSend">发送</button>
    </div>
  </div>
</aside>

<div class="sheet-mask" id="mask"></div>
<div class="sheet-box" id="sheet"></div>
<div class="sheet-mask" id="pmask"></div>
<div class="sheet-box" id="pick"></div>
<div id="edit"></div>

<input type="file" id="fJson" accept=".json" style="display:none">
<input type="file" id="fBg" accept="image/*" style="display:none">

<script>
/* ============================================================
   HY兔 · 剧本创作工作台
   ============================================================ */
(function(){
"use strict";
var KEY="hytu.v1", SYNCKEY="hytu.sync.v1", AIKEY="hytu.ai.v1";
var $=function(id){return document.getElementById(id)};
var uid=function(){return "n"+Math.random().toString(36).slice(2,9)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function stripTags(s){return String(s==null?"":s).replace(/<[^>]*>/g,"").replace(/&nbsp;/g," ")}
function cn(s){return stripTags(s).replace(/\s/g,"").length}
function fmt(n){return (n||0).toLocaleString("zh-CN")}
function cut(s,n){var t=stripTags(s);return t.length>n?t.slice(0,n)+"…":t}

function pairWord(a,b){
  if(!a||!b) return "";
  if(PAIR[a+"|"+b]) return PAIR[a+"|"+b];
  if(a===b) return a;
  return a+"与"+b;
}
/* 关系双向同步：A 的档案里写了 B，B 的档案里也要出现 A，两端对调 */
function syncPair(p){
  rels(p).forEach(function(rl){
    var t=nameOf(rl.to); if(!t) return;
    if(!t.rel) t.rel=[];
    var back=t.rel.filter(function(x){return x.to===p.name})[0];
    if(!back){ back={mid:"",a:"",b:"",to:p.name}; t.rel.push(back) }
    back.a=rl.b||""; back.b=rl.a||"";
    var pw=PAIR[(rl.b||"")+"|"+(rl.a||"")];
    back.mid=pw||rl.mid||"";
  });
}
function dropPair(p,rl){
  var t=nameOf(rl.to); if(!t||!t.rel) return;
  t.rel=t.rel.filter(function(x){return x.to!==p.name});
}
function fixMid(rl){
  if(!rl.a||!rl.b) return;
  if(!rl.mid||KIN[rl.mid]){ var w=pairWord(rl.a,rl.b); if(w) rl.mid=w }
}
function parseRel(str){
  if(!str) return [];
  return str.split("|").map(function(x){
    var i=x.indexOf(":");
    var head=i<0?x:x.slice(0,i), to=i<0?"":x.slice(i+1);
    var f=head.split("/");
    return {mid:(f[0]||"").trim(),a:(f[1]||"").trim(),b:(f[2]||"").trim(),to:to.trim()};
  }).filter(function(x){return x.mid||x.to});
}

function relTime(t){
  if(!t) return "";
  var d=(Date.now()-t)/1000;
  if(d<60) return "刚刚";
  if(d<3600) return Math.floor(d/60)+" 分钟前";
  if(d<86400) return Math.floor(d/3600)+" 小时前";
  var dt=new Date(t);
  return (dt.getMonth()+1)+"-"+dt.getDate()+" "+String(dt.getHours()).padStart(2,"0")+":"+String(dt.getMinutes()).padStart(2,"0");
}
/* ---- 辅助线样式 ---- */
var RSTYLE=[["solid","实线"],["dash","虚线"],["dot","点线"],["wave","波浪线"],["pencil","铅笔线"],["double","双线"]];
function ruleBG(style,color,w,gap){
  color=color||"#CFE0EA"; w=Math.max(1,w||1); gap=Math.max(16,gap||28);
  var Y=(gap-Math.max(2,w)).toFixed(1), st='fill="none" stroke="'+color+'" stroke-width="'+w+'"';
  /* preserveAspectRatio=none 是关键：不写的话 SVG 会保持比例，
     被居缩成一小段，看起来就像纸中间冒出几根短线。 */
  var head='<svg xmlns="http://www.w3.org/2000/svg" width="60" height="'+gap+'" viewBox="0 0 60 '+gap+'" preserveAspectRatio="none">';
  var svg;
  if(style==="dash") svg=head+'<line x1="-2" y1="'+Y+'" x2="62" y2="'+Y+'" '+st+' stroke-dasharray="14 8"/></svg>';
  else if(style==="dot") svg=head+'<line x1="0" y1="'+Y+'" x2="60" y2="'+Y+'" '+st+' stroke-dasharray="1 '+(4+w*2)+'" stroke-linecap="round"/></svg>';
  else if(style==="wave") svg=head+'<path d="M-2 '+Y+' q 8 -'+(3+w*2)+' 16 0 t 16 0 t 16 0 t 16 0" '+st+'/></svg>';
  else if(style==="pencil") svg=head+'<path d="M-2 '+Y+' L9 '+(Y-1.5)+' L22 '+(Y+1.5)+' L35 '+(Y-1)+' L48 '+(Y+1.6)+' L62 '+Y+'" '+st+' stroke-linecap="round" stroke-linejoin="round"/></svg>';
  else if(style==="double") svg=head+'<line x1="-2" y1="'+Y+'" x2="62" y2="'+Y+'" '+st+' stroke-width="'+(Math.max(1,w*0.7)).toFixed(1)+'" opacity=".85"/><line x1="-2" y1="'+(+Y+Math.max(3,w*2.4)).toFixed(1)+'" x2="62" y2="'+(+Y+Math.max(3,w*2.4)).toFixed(1)+'" '+st+' stroke-width="'+(Math.max(1,w*0.7)).toFixed(1)+'" opacity=".45"/></svg>';
  else svg=head+'<line x1="-2" y1="'+Y+'" x2="62" y2="'+Y+'" '+st+'/></svg>';
  return {img:'url("data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)+'")', size:"100% "+gap+"px"};
}
function paintRules(scope){
  var L=S.look||{};
  var W=1000;
  Array.prototype.forEach.call((scope||document).querySelectorAll("[data-rule]"),function(el){
    el.style.position="absolute"; el.style.inset="0"; el.style.overflow="hidden";
    el.style.pointerEvents="none"; el.style.backgroundImage="none";
    el.innerHTML="";
    if(!L.rule||el.hasAttribute("data-norule")) return;
    var c=L.rc||"#CFE0EA", w=Math.max(1,L.rw||1), g=Math.max(16,L.rg||28);
    var par=el.parentElement;
    var H=Math.max(el.clientHeight||0, par?par.scrollHeight:0, 1800);
    var s='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" '+
          'style="position:absolute;left:0;top:0;width:100%;height:'+H+'px;display:block">';
    var st='fill="none" stroke="'+c+'" stroke-width="'+w+'" stroke-linecap="round"';
    for(var y=g;y<H;y+=g){
      var sty=L.rstyle||"solid";
      if(sty==="dash") s+='<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" '+st+' stroke-dasharray="26 16"/>';
      else if(sty==="dot") s+='<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" '+st+' stroke-dasharray="1 '+(6+w*3)+'"/>';
      else if(sty==="wave"){ var d="M0 "+y; for(var x=0;x<W;x+=40) d+=" q 10 -"+(4+w*2)+" 20 0 q 10 "+(4+w*2)+" 20 0"; s+='<path d="'+d+'" '+st+'/>' }
      else if(sty==="pencil"){ var d2="M0 "+y; for(var i=0,x2=0;x2<W;x2+=18,i++) d2+=" L"+(x2+9)+" "+(y+(i%2?1.6:-1.6)); d2+=" L"+W+" "+y; s+='<path d="'+d2+'" '+st+' stroke-linejoin="round"/>' }
      else if(sty==="double") s+='<line x1="0" y1="'+(y-1.6)+'" x2="'+W+'" y2="'+(y-1.6)+'" '+st+' stroke-width="'+(w*0.7).toFixed(1)+'" opacity=".85"/><line x1="0" y1="'+(y+2.6)+'" x2="'+W+'" y2="'+(y+2.6)+'" '+st+' stroke-width="'+(w*0.7).toFixed(1)+'" opacity=".45"/>';
      else s+='<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" '+st+'/>';
    }
    el.innerHTML=s+'</svg>';
  });
}

  var box=$("pick"), mk=$("pmask");
  if(!box) return;

  opts.forEach(function(o){
    h+='<button class="li" data-i="'+o.i+'" style="margin-bottom:6px"><span class="t">'+esc(o.t)+'</span>'+
       (o.i===s.selectedIndex?'<span class="go">✓</span>':'')+'</button>';
  });
  h+='<div class="row" style="margin-top:8px"><button class="btn" id="_pcancel">取消</button></div>';
  box.innerHTML=h; box.classList.add("on"); if(mk) mk.classList.add("on");
  place(box,true); box.style.zIndex="72";
  box.addEventListener("click",function(ev){
    var b=ev.target.closest("button[data-i]");
    if(b){ s.selectedIndex=+b.getAttribute("data-i");
      box.classList.remove("on"); if(mk) mk.classList.remove("on"); box.style.transform="";
      try{ s.dispatchEvent(new Event("change",{bubbles:true})) }catch(e){} return; }
    if(ev.target.id==="_pcancel"){ box.classList.remove("on"); if(mk) mk.classList.remove("on"); box.style.transform=""; }
  });
  if(mk) mk.onclick=function(){ box.classList.remove("on"); if(mk) mk.classList.remove("on"); box.style.transform="" };
}

/* ---------------- 路由 ---------------- */
function go(mod,extra){
  r.mod=mod||""; if(extra) for(var k in extra) r[k]=extra[k];
  if(!extra||!extra.act) r.act="";
  r.step=""; r.gid=r.gid||"";
  if(mod!=="script") r.cast="";
  if(mod!=="line") r.pid="";
  if(mod!=="dm") r.block="";
  r.edit=null; document.body.classList.remove("editing");
  document.body.classList.toggle("inmod",!!r.mod);
  var nm="HY兔"; if(r.mod) for(var i=0;i<MODS.length;i++) if(MODS[i].id===r.mod) nm=MODS[i].nm;
  $("title").textContent=nm;
  render();
}
function backOne(){
  closeSheet();
  if(r.edit) return closeEdit();
  if(r.mod==="script"&&r.step==="write"){ r.step="act"; return render() }
  if(r.mod==="script"&&r.step==="act"){ r.step=""; r.cast=""; return render() }
  if(r.mod==="line"&&r.pid){ r.pid=""; return render() }
  if(r.mod==="line"&&r.act){ r.act=""; return render() }
  if(r.mod==="cast"&&r.pid){ r.pid=""; return render() }
  if(r.mod==="dm"&&r.block){ r.block=""; return render() }
  if(r.mod==="dm"&&r.act){ r.act=""; return render() }
  if(r.mod) return go("");
}
/* 手机的系统返回手势：退回应用上一级，而不是直接退出 */
var histDepth=0, inPop=false;
window.addEventListener("popstate",function(){
  inPop=true; backOne(); inPop=false;
  if(r.edit||r.mod){ try{ history.pushState({d:Date.now()},""); histDepth++ }catch(e){} }
  else histDepth=0;
});
$("back").addEventListener("click",function(){
  if(histDepth>0){ try{ history.back(); return }catch(e){} }
  backOne();
});
function renderInner(){
  closeSheet();
  /* 每次都换一个全新的 <main>，否则事件监听会一层层累加，
     点一次按钮触发好几次（加字段一次加两条就是这个原因）。 */
  var old=document.getElementById("view");
  var v=document.createElement("main"); v.id="view";
  old.parentNode.replaceChild(v,old);
  document.body.classList.toggle("editing",!!r.edit);
  if(r.edit){ renderEdit(); return }
  if(!r.mod){ v.innerHTML=homeHTML(); setTimeout(bindHome,0); return }
  if(r.mod==="script"){
    if(r.step==="act"){ v.innerHTML=scriptActHTML(); bindScriptAct(); }
    else if(r.step==="write"){ v.innerHTML=scriptWriteHTML(); }
    else { v.innerHTML=scriptHTML(); bindScript(); }
    return;
  }
  if(r.mod==="acts"){ v.innerHTML=actsHTML(); bindActs(); return }
  if(r.mod==="flow"){ v.innerHTML=flowHTML(); bindFlow(); return }
  if(r.mod==="room"){ v.innerHTML=roomHTML(); bindRoom(); return }
  if(r.mod==="cast"){ v.innerHTML = r.pid ? castEditHTML() : castHTML(); bindCast(); return }
  if(r.mod==="graph"){ v.innerHTML=graphHTML(); bindGraph(); return }
  if(r.mod==="line"){ v.innerHTML=lineHTML(); bindLine(); return }
  if(r.mod==="dm"){ v.innerHTML=dmHTML(); bindDm(); return }
  if(r.mod==="pref"){ v.innerHTML=prefHTML(); bindPref(); return }
  if(r.mod==="ai"){ v.innerHTML='<div class="sect"><div class="empty">AI 面板已从右侧打开。<br>第一次用，点面板右上「设置」填一次接口。</div></div>';
    document.body.classList.add("aion"); aiFill(); aiRender(); return }
  v.innerHTML=docsHTML(r.mod); bindDocs();
}
function pageKey(){
  if(r.edit) return r.edit.tkey||null;
  if(r.mod==="script"&&r.step==="write") return "w|"+r.cast+"|"+r.act;
  if(r.mod==="cast"&&r.pid) return "p|"+r.pid;
  if(r.mod==="dm"&&r.act&&r.block) return "b|"+r.act+"|"+r.block;
  return null;
}
function depthOf(){
  var d=r.mod?1:0;
  if(r.edit) return 6;
  if(r.mod==="script"){ if(r.step==="act") d=2; if(r.step==="write") d=3 }
  if(r.mod==="line"){ if(r.act) d=2; if(r.pid) d=3 }
  if(r.mod==="dm"){ if(r.act) d=2; if(r.block) d=3 }
  if(r.mod==="cast"&&r.pid) d=2;
  return d;
}
var curDepth=0;
function render(){
  var d=depthOf();
  /* 同级重绘（加关系、勾选、加字段…）保持滚动位置，只有换页才回到顶部 */
  var v0=document.getElementById("view"), g0=document.querySelector(".gside");
  var s0=v0?v0.scrollTop:0, s1=g0?g0.scrollTop:0;
  var same=(d===curDepth);
  renderInner(); startSess(pageKey());
  if(same){
    var v1=document.getElementById("view"), g1=document.querySelector(".gside");
    if(v1) v1.scrollTop=s0;
    if(g1) g1.scrollTop=s1;
  }
  if(!inPop && d>curDepth){ try{ history.pushState({d:Date.now()},""); histDepth++ }catch(e){} }
  curDepth=d;
}
function bindHome(){
  Array.prototype.forEach.call(document.querySelectorAll(".mod"),function(b){
    b.addEventListener("click",function(){go(b.getAttribute("data-m"))});

}

function graphHTML(){
  var n=S.cast.length; if(!n) return '<div class="sect"><div class="empty">还没有人物</div></div>';
  var focus=r.focus||"", all=!!r.allRel;
  var W=1000, R=Math.min(W*0.37,Math.max(168,n*16+80)), H=Math.round(2*(R+56)+170), cx=W/2, cy=H/2;
  var pos={};
  S.cast.forEach(function(p,i){ var a=-Math.PI/2+i*2*Math.PI/n, rr=R+(i%2?56:0);
    pos[p.id]={x:cx+rr*Math.cos(a),y:cy+rr*Math.sin(a)} });
  var edges="",seen={};
  S.cast.forEach(function(p){
    rels(p).forEach(function(rl){
      var q=nameOf(rl.t); if(!q||q.id===p.id) return;
      var k=[p.id,q.id].sort().join("-"); if(seen[k]) return; seen[k]=1;
      var a=pos[p.id],b=pos[q.id],mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      var hot=(!focus) || p.id===focus || q.id===focus;
      var show=all || (focus && hot);
      if(focus && !hot) return;
      edges+='<line x1="'+a.x.toFixed(1)+'" y1="'+a.y.toFixed(1)+'" x2="'+b.x.toFixed(1)+'" y2="'+b.y.toFixed(1)+
        '" stroke="'+(focus?"#C6B8E4":"#E2D7CA")+'" stroke-width="'+(focus?"1.9":"1.1")+'"/>'+
        (show?'<text class="gl" x="'+mx.toFixed(1)+'" y="'+(my-3).toFixed(1)+'" text-anchor="middle">'+esc(rl.l)+'</text>':'');
    });
  });
  var nodes="";
  S.cast.forEach(function(p){
    var q=pos[p.id],w=Math.max(62,p.name.length*15+20);
    var on=(p.id===focus);
    nodes+='<g class="gnode" data-p="'+p.id+'" style="cursor:pointer">'+
     '<rect x="'+(q.x-w/2).toFixed(1)+'" y="'+(q.y-15).toFixed(1)+'" width="'+w+'" height="30" rx="15" fill="'+(on?"#F7F2FF":"#FFFDFC")+
     '" stroke="'+p.color+'" stroke-width="'+(on?3:1.8)+'"/>'+
     '<text class="gn" x="'+q.x.toFixed(1)+'" y="'+(q.y+4).toFixed(1)+'" text-anchor="middle">'+esc(p.name)+'</text>'+
     (p.kind?'<text class="gl" x="'+q.x.toFixed(1)+'" y="'+(q.y+27).toFixed(1)+'" text-anchor="middle">'+esc(p.kind)+'</text>':'')+'</g>';
  });
  return '<div class="sect"><div class="row" style="margin-bottom:10px"><span class="ti">关系图</span>'+
    '<button class="btn sm" id="_allrel" style="margin-left:auto">'+(all?"只看连线":"显示全部关系名")+'</button>'+
    (focus?'<button class="btn sm" id="_nofocus">取消选中</button>':'')+'</div>'+
    '<div class="gwrap"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+edges+nodes+'</svg></div>'+
    '<div class="mu" style="margin-top:10px;text-align:center">'+
    (focus?"已选中：「"+esc(person(focus).name)+"」——只显示与 Ta 有关的关系。再点一次可看小传。":"点一个人名，只看与他有关的关系；图上太密就是这个原因。")+'</div></div>';
}

    if(e.target.id==="_allrel"){ r.allRel=!r.allRel; return render() }
    if(e.target.id==="_nofocus"){ r.focus=""; return render() }

function bindPref(){
  var L=S.look, v=$("view");
  v.addEventListener("input",function(e){
    var t=e.target;
    if(t.id==="_lf"){L.fam=t.value;save()}
    else if(t.id==="_lfr"){L.fs=+t.value;$("_lfs").textContent=t.value;save()}
    else if(t.id==="_lk"){L.ink=t.value;save()}
    else if(t.id==="_bgcol"){L.bgc=t.value;L.bg="color";save()}
    else if(t.id==="_lrc"){L.rc=t.value;save();paintRules(v)}
    else if(t.id==="_lrw"){L.rw=+t.value;$("_lrws").textContent=t.value;save();paintRules(v)}
    else if(t.id==="_lrg"){L.rg=+t.value;$("_lrgs").textContent=t.value;save();paintRules(v)}
  });
  v.addEventListener("change",function(e){
    if(e.target.id==="_lron"){ L.rule=e.target.checked; save(1) }
    if(e.target.id==="_lrs"){ L.rstyle=e.target.value; save(1) }
    paintRules(v);
  });
  v.addEventListener("click",function(e){
    var t=e.target; if(!t.id) return;
    if(t.id==="_bgc"){L.bg="color";save(1);render()}
    else if(t.id==="_bgi") $("fBg").click();
    else if(t.id==="_bgx"){L.bgi="";L.bg="color";save(1);render()}
    else if(t.id==="_bak") openText("备份 · "+stamp(),JSON.stringify(S),false);
    else if(t.id==="_res") openText("恢复", "", true);
    else if(t.id==="_mdex"){
      var o="# HY兔导出 · "+stamp()+"\n";
      S.docs.forEach(function(d){o+="\n## "+d.title+"\n\n"+stripTags(d.body)+"\n"});
      S.acts.forEach(function(a){
        o+="\n\n# "+a.name+(a.theme?" "+a.theme:"")+"\n";
        players().forEach(function(p){ var f=S.sc[p.id]&&S.sc[p.id][a.id]; if(!f) return;
          o+="\n## "+p.name+" · "+a.name+"\n";
          f.fields.forEach(function(x){ o+="\n### "+x.n+"\n\n"+stripTags(x.v)+"\n" }) });
      });
      openText("导出 Markdown · "+stamp(), o, false);
    }
    else if(t.id==="_addfac") ask("新阵营","名字","",function(n){ if(!n) return;
      n=n.trim(); if(S.factions.indexOf(n)<0) S.factions.push(n); save(1); render() });
    else if(t.getAttribute&&t.getAttribute("data-renfac")){
      var oldF=t.getAttribute("data-renfac");
      ask("改阵营名","",oldF,function(n){ if(!n) return; n=n.trim();
        S.factions=S.factions.map(function(f){return f===oldF?n:f});
        S.cast.forEach(function(p){ if(p.fac===oldF) p.fac=n });
        save(1); render(); });
    }
    else if(t.getAttribute&&t.getAttribute("data-delfac2")){
      var df=t.getAttribute("data-delfac2");
      confirmBox("删除阵营「"+df+"」？","属于它的人会变成「其他」。",function(){
        S.factions=S.factions.filter(function(f){return f!==df});
        S.cast.forEach(function(p){ if(p.fac===df) p.fac="其他" });
        if(S.factions.indexOf("其他")<0) S.factions.push("其他");
        save(1); render(); });
    }
  });
}

function stamp(){var d=new Date(),p=function(n){return(n<10?"0":"")+n};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function dl(name,text,mime){
  var b=new Blob([text],{type:(mime||"text/plain")+";charset=utf-8"});
  var u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove()},400);
}
$("fJson").addEventListener("change",function(){

  };
  rd.readAsText(f); this.value="";

function aiCtxText(){
  if(ai.ctx!=="on") return "";
  var parts=[];
  var g=S.docs.filter(function(d){return d.title==="项目总纲"})[0];
  if(g&&g.body) parts.push("【项目总纲】\n"+g.body);
  if(r.mod==="script"&&r.cast&&r.act){
    var p=person(r.cast),a=act(r.act),f=field(r.cast,r.act),t=[];
    f.fields.forEach(function(x){ if(cn(x.v)) t.push(x.n+"：\n"+stripTags(x.v)) });
    if(t.length) parts.push("【"+p.name+" · "+a.name+" 剧本】\n"+t.join("\n"));
  }
  if(r.mod==="cast"||r.mod==="graph") parts.push("【人物】\n"+S.cast.map(function(p){return p.name+"（"+(p.fac||"")+(p.kind?"·"+p.kind:"")+"）："+cut(p.bio,60)}).join("\n"));
  var s=parts.join("\n\n"); if(s.length>6000) s=s.slice(0,6000)+"\n…（省略）";
  return s;
}
function aiSend(text){
  if(aiBusy) return;
  text=(text||$("aiIn").value).trim(); if(!text) return;
  $("aiIn").value=""; autoGrow();
  var url;
  try{
    if(ai.mode==="proxy"){ var u=(ai.proxy||"").replace(/\/+$/,""); if(!u) throw new Error("还没填接口地址"); url=u+"/ai" }
    else { var b=(ai.base||"").replace(/\/+$/,""); if(!b) throw new Error("还没填接口地址");
      if(!ai.key) throw new Error("还没填 API Key"); url=b+"/chat/completions" }
  }catch(err){ aiLog.push({role:"assistant",content:"⚠ "+err.message}); aiRender(); return }
  aiLog.push({role:"user",content:text}); aiLog.push({role:"assistant",content:"…"});
  aiRender(); aiBusy=true; $("aiSend").disabled=true;
  var ctx=aiCtxText();
  var msgs=[{role:"system",content:SYS+(ctx?"\n\n以下是他的项目资料：\n"+ctx:"")}];
  aiLog.slice(-13,-1).forEach(function(m){ if(m.content) msgs.push({role:m.role,content:m.content}) });
  var hd={"Content-Type":"application/json"};
  if(ai.mode==="direct") hd["Authorization"]="Bearer "+ai.key;
  fetch(url,{method:"POST",headers:hd,body:JSON.stringify({messages:msgs,stream:true})})
   .then(function(res){
     if(!res.ok) return res.text().then(function(t){throw new Error("接口 "+res.status+"："+t.slice(0,140))});
     var ct=res.headers.get("content-type")||"";
     if(ct.indexOf("event-stream")<0) return res.json().then(function(j){
       var c=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content; aiDone(c||"") });
     var rd=res.body.getReader(),dec=new TextDecoder(),buf="",acc="";
     (function pump(){
       return rd.read().then(function(x){
         if(x.done){ aiDone(acc); return }
         buf+=dec.decode(x.value,{stream:true});
         var ls=buf.split("\n"); buf=ls.pop();
         ls.forEach(function(ln){
           ln=ln.trim(); if(ln.indexOf("data:")!==0) return;
           var p=ln.slice(5).trim(); if(p==="[DONE]") return;
           try{ var j=JSON.parse(p),d=j.choices&&j.choices[0]&&j.choices[0].delta;
             if(d&&d.content){ acc+=d.content; var last=$("aiLog").lastElementChild;
               if(last){ last.innerHTML=esc(acc).replace(/\*\*(.+?)\*\*/g,"<em>$1</em>"); $("aiLog").scrollTop=$("aiLog").scrollHeight } }
           }catch(e){}
         });
         return pump();
       })
     })();
   })
   .catch(function(err){
     var m=String((err&&err.message)||err);
     if(m.indexOf("Failed to fetch")>=0||m.indexOf("Load failed")>=0) m="连不上接口。检查接口地址和 Key，或看是不是被跨域挡住了。";
     aiLog[aiLog.length-1]={role:"assistant",content:"⚠ "+m};
     aiBusy=false; $("aiSend").disabled=false; aiSaveLog(); aiRender();
   });
}

var cfg={}; try{cfg=JSON.parse(localStorage.getItem(SYNCKEY))||{}}catch(e){cfg={}}
if(!cfg.mode) cfg.mode="off";
var syncDirty=false,syncTimer=null,syncBusy=false,pollTimer=null;
function saveCfg(){ try{localStorage.setItem(SYNCKEY,JSON.stringify(cfg))}catch(e){} }
function setSync(k,l){
  var p=$("syncPill"); p.className="pill"+(k?" "+k:"");
  p.querySelector("span").textContent=l||(k==="ok"?"已同步":k==="busy"?"同步中":k==="err"?"同步失败":"同步");
}
function gistH(){ return {"Authorization":"Bearer "+cfg.token,"Accept":"application/vnd.github+json","Content-Type":"application/json"} }
function join(u,c){ return u+(u.indexOf("?")<0?"?":"&")+"code="+encodeURIComponent(c) }
function pull(){
  if(cfg.mode==="gist"){
    if(!cfg.token) return Promise.reject(new Error("还没填 Token"));
    if(!cfg.gistId) return Promise.resolve(null);
    return fetch("https://api.github.com/gists/"+cfg.gistId,{headers:gistH()}).then(function(x){
      if(!x.ok) throw new Error("GitHub "+x.status); return x.json()
    }).then(function(j){ var f=j.files&&j.files["hytu.json"]; if(!f) return null;
      if(f.truncated&&f.raw_url) return fetch(f.raw_url).then(function(y){return y.text()}).then(JSON.parse);
      return JSON.parse(f.content) });
  }
  if(cfg.mode==="http"){
    if(!cfg.url||!cfg.code) return Promise.reject(new Error("还没填接口地址或同步码"));
    return fetch(join(cfg.url,cfg.code),{cache:"no-store"}).then(function(x){
      if(x.status===404) return null; if(!x.ok) throw new Error("接口 "+x.status); return x.text()
    }).then(function(t){ var s=(t||"").trim(); return (s&&s!=="null")?JSON.parse(s):null });
  }
  return Promise.resolve(null);
}
function push(data){
  if(cfg.mode==="gist"){
    var body={description:"HY兔 自动备份",files:{"hytu.json":{content:JSON.stringify(data)}}};
    if(cfg.gistId) return fetch("https://api.github.com/gists/"+cfg.gistId,{method:"PATCH",headers:gistH(),body:JSON.stringify(body)})
      .then(function(x){ if(!x.ok) throw new Error("GitHub "+x.status); return true });
    body.public=false;
    return fetch("https://api.github.com/gists",{method:"POST",headers:gistH(),body:JSON.stringify(body)})
      .then(function(x){ if(!x.ok) throw new Error("GitHub "+x.status); return x.json() })
      .then(function(j){ cfg.gistId=j.id; saveCfg(); return true });
  }
  if(cfg.mode==="http"){
    return fetch(join(cfg.url,cfg.code),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)})
      .then(function(x){ if(!x.ok) throw new Error("接口 "+x.status); return true });
  }
  return Promise.resolve(true);
}
function syncNow(quiet){
  if(cfg.mode==="off"||syncBusy) return;
  syncBusy=true; if(!quiet) setSync("busy");
  var lt=S.ts||0;
  pull().then(function(rem){
    var rt=(rem&&rem.ts)?rem.ts:0;
    if(rem&&rt>lt+1500&&!syncDirty){ S=rem; save(1); go(r.mod); setSync("ok","已拉取"); return }
    if(!rem&&lt===0) S.ts=Date.now();
    return push(S).then(function(){ syncDirty=false; setSync("ok") });
  }).catch(function(e){ setSync("err",String((e&&e.message)||e).slice(0,16)) })
   .then(function(){ syncBusy=false });
}
function scheduleSync(){ syncDirty=true; if(!cfg||cfg.mode==="off") return; clearTimeout(syncTimer); syncTimer=setTimeout(function(){syncNow(true)},5000) }
function startPoll(){ clearInterval(pollTimer); if(cfg.mode==="off") return;
  pollTimer=setInterval(function(){ if(document.hidden||syncDirty) return; syncNow(true) },60000) }
function syncSheet(){
  openSheet('<h3>自动同步</h3><p class="mu" style="margin:0 0 8px">两台设备填成一模一样，改动就会自动同步。</p>'+
   '<div class="lbl">方式</div><select class="inp" id="_sm">'+
   [["off","关闭"],["gist","GitHub Gist（推荐）"],["http","自建接口"]].map(function(o){
     return '<option value="'+o[0]+'"'+(cfg.mode===o[0]?" selected":"")+'>'+o[1]+'</option>'}).join("")+'</select>'+
   '<div id="_sg"><div class="lbl">Token</div><input class="inp" id="_st" value="'+esc(cfg.token||"")+'">'+

function bindRuleBar(){
  Array.prototype.forEach.call(document.querySelectorAll(".rbar [data-r]"),function(el){
    var ev=(el.tagName==="INPUT"&&(el.type==="color"))?"change":"input";
    el.addEventListener(ev,function(){
      var k=el.getAttribute("data-r"), L=S.look;
      if(k==="on") L.rule=el.checked;
      else if(k==="style") L.rstyle=el.value;
      else if(k==="color") L.rc=el.value;
      else if(k==="w") L.rw=+el.value;
      else if(k==="g") L.rg=+el.value;
      save();
      paintRules(document);
      Array.prototype.forEach.call(document.querySelectorAll(".rbar [data-r]"),function(o){
        if(o===el) return;
        if(o.getAttribute("data-r")==="on") o.checked=L.rule;
      });

function wrapSel(css){
  var sel=window.getSelection(); if(!sel||!sel.rangeCount||sel.isCollapsed) return false;
  var range=sel.getRangeAt(0), ed=range.startContainer;
  while(ed&&ed.nodeType!==1) ed=ed.parentNode;
  if(!ed||!ed.closest||!ed.closest(".edit2")) return false;
  var span=document.createElement("span"); span.setAttribute("style",css);
  try{ range.surroundContents(span) }
  catch(e){ var frag=range.extractContents(); span.appendChild(frag); range.insertNode(span) }
  sel.removeAllRanges();
  var nr=document.createRange(); nr.selectNodeContents(span); sel.addRange(nr);
  return true;
}

      var p5=person(r.pid); if(p5) p5.fac=n; save(1); render() });

    });
    h+='<div class="gwork"><div class="gside" id="_gside">'+sideHTML(grp)+'</div>'+

       (focus?"已选中「"+esc(person(focus)?person(focus).name:"")+"」。再点一次看小传。":"点人名只看与他有关的连线；按住名字可以直接拖动位置。")+

  }

}

function bindGraph(){

      if(!n) return; var g={id:uid(),title:n,members:[],pos:{}}; S.groups.push(g); r.gid=g.id; save(1); render() });
    if(t.id==="_rengrp"){ var g0=curGroup(); return ask("改标题","",g0.title,function(n){ if(!n) return; g0.title=n; save(1); render() }) }
    if(t.id==="_delgrp"){
      if(S.groups.length<=1) return alert("至少留一个图组");
      var g1=curGroup();
      return confirmBox("删除图组「"+g1.title+"」？","只删这张图，人物本身不受影响。",function(){
        S.groups=S.groups.filter(function(x){return x.id!==g1.id}); r.gid=""; save(1); render() });
    }
    if(t.id==="_allsel"){ var g2=curGroup(); g2.members=S.cast.map(function(p){return p.id}); save(1); return render() }
    if(t.id==="_nonesel"){ curGroup().members=[]; save(1); return render() }
    if(t.id==="_nofocus"){ r.focus=""; return render() }
    var gb=t.closest("button[data-g]");
    if(gb){ r.gid=gb.getAttribute("data-g"); r.focus=""; return render() }
    var node=t.closest(".gnode");
    if(node){
      var id=node.getAttribute("data-p");
      if(r.focus===id){ var p=person(id); if(p) showBio(p); return }
      r.focus=id; return render();
    }
  });
  v.addEventListener("change",function(e){
    var t=e.target;
    if(t.id==="_relshow"){ S.relShow=t.value; save(1); return render() }
    var m=t.getAttribute&&t.getAttribute("data-m"); if(!m) return;
    var grp=curGroup(), on=t.checked;
    var has=grp.members.indexOf(m)>=0;
    if(on&&!has) grp.members.push(m);
    if(!on&&has) grp.members=grp.members.filter(function(x){return x!==m});
    save(1); render();
  });
  var svg=$("_gsvg");
  if(!svg) return;
  var drag=null;
  svg.addEventListener("pointerdown",function(e){
    var g=e.target.closest(".gnode"); if(!g) return;
    var rect=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal;
    drag={g:g,id:g.getAttribute("data-p"),ox:e.clientX,oy:e.clientY,
      x0:+g.getAttribute("data-x"),y0:+g.getAttribute("data-y"),
      sx:vb.width/rect.width, sy:vb.height/rect.height, moved:false};
    g.classList.add("drag");
    try{ svg.setPointerCapture(e.pointerId) }catch(err){}
    e.preventDefault();
  });
  svg.addEventListener("pointermove",function(e){
    if(!drag) return;
    var dx=(e.clientX-drag.ox)*drag.sx, dy=(e.clientY-drag.oy)*drag.sy;
    if(Math.abs(dx)>3||Math.abs(dy)>3) drag.moved=true;
    drag.g.setAttribute("transform","translate("+dx.toFixed(1)+","+dy.toFixed(1)+")");
    drag.nx=drag.x0+dx; drag.ny=drag.y0+dy;
  });
  function endDrag(){
    if(!drag) return;
    var d=drag; drag=null; d.g.classList.remove("drag");
    if(d.moved){
      var grp=curGroup();
      grp.pos[d.id]={x:Math.round(d.nx||d.x0),y:Math.round(d.ny||d.y0)};
      save(1); render();
    } else { render() }
  }
  svg.addEventListener("pointerup",endDrag);
  svg.addEventListener("pointercancel",endDrag);
}

function bindGraph(){
  var v=$("view");
  v.addEventListener("click",function(e){
    var t=e.target;
    if(t.id==="_newgrp") return ask("新图组","给它起个标题（比如「秦鸾线」「纪家」）","",function(n){
      if(!n) return; var g={id:uid(),title:n,members:[],pos:{}}; S.groups.push(g); r.gid=g.id; save(1); render() });
    if(t.id==="_rengrp"){ var g0=curGroup(); return ask("改标题","",g0.title,function(n){ if(!n) return; g0.title=n; save(1); render() }) }
    if(t.id==="_delgrp"){
      if(S.groups.length<=1) return alert("至少留一个图组");
      var g1=curGroup();
      return confirmBox("删除图组「"+g1.title+"」？","只删这张图，人物本身不受影响。",function(){
        S.groups=S.groups.filter(function(x){return x.id!==g1.id}); r.gid=""; save(1); render() });
    }
    if(t.id==="_allsel"){ curGroup().members=S.cast.map(function(p){return p.id}); save(1); return renderKeep() }
    if(t.id==="_nonesel"){ curGroup().members=[]; save(1); return renderKeep() }
    if(t.id==="_nofocus"){ r.focus=""; return renderKeep() }
    var gb=t.closest("button[data-g]");
    if(gb){ r.gid=gb.getAttribute("data-g"); r.focus=""; return render() }
    var node=t.closest(".gnode");
    if(node){
      var id=node.getAttribute("data-p");
      if(r.focus===id){ var p=person(id); if(p) showBio(p); return }
      r.focus=id; return renderKeep();
    }
  });
  v.addEventListener("change",function(e){
    var t=e.target;
    if(t.id==="_relshow"){ S.relShow=t.value; save(1); return renderKeep() }
    var m=t.getAttribute&&t.getAttribute("data-m"); if(!m) return;
    var grp=curGroup(), on=t.checked, has=grp.members.indexOf(m)>=0;
    if(on&&!has) grp.members.push(m);
    if(!on&&has) grp.members=grp.members.filter(function(x){return x!==m});
    save(1); renderKeep();
  });
  var svg=$("_gsvg"), gz=$("_gz");
  if(!svg||!gz) return;
  var z=r.z||1, tx=r.tx||0, ty=r.ty||0;
  function apply(){ gz.setAttribute("transform","translate("+tx.toFixed(1)+","+ty.toFixed(1)+") scale("+z.toFixed(3)+")"); r.z=z; r.tx=tx; r.ty=ty }
  apply();
  function pt(e){
    var rect=svg.getBoundingClientRect(), vb=svg.viewBox.baseVal;
    return {x:(e.clientX-rect.left)/rect.width*vb.width, y:(e.clientY-rect.top)/rect.height*vb.height};
  }
  function zoomAt(px,py,f){
    var nz=Math.min(4,Math.max(0.35,z*f)); f=nz/z;
    tx=px-(px-tx)*f; ty=py-(py-ty)*f; z=nz; apply();
  }
  $("_zin").onclick=function(){ zoomAt(500,540,1.3) };
  $("_zout").onclick=function(){ zoomAt(500,540,1/1.3) };
  $("_zrst").onclick=function(){ z=1;tx=0;ty=0; apply() };
  svg.addEventListener("wheel",function(e){
    e.preventDefault(); var p=pt(e); zoomAt(p.x,p.y,e.deltaY<0?1.12:1/1.12);
  },{passive:false});
  var ptrs={}, pinch=null, pan=null, nd=null;
  svg.addEventListener("pointerdown",function(e){
    ptrs[e.pointerId]=pt(e);
    var ids=Object.keys(ptrs);
    if(ids.length===2){
      var a=ptrs[ids[0]], b=ptrs[ids[1]];
      pinch={d:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y))}; nd=null; pan=null; return;
    }
    var el=e.target.closest(".gnode");
    if(el){ nd={el:el,id:el.getAttribute("data-p"),x0:+el.getAttribute("data-x"),y0:+el.getAttribute("data-y"),p0:pt(e),moved:false} }
    else { pan={p0:pt(e),tx0:tx,ty0:ty} }
    try{ svg.setPointerCapture(e.pointerId) }catch(err){}
    e.preventDefault();
  });
  svg.addEventListener("pointermove",function(e){
    if(!ptrs[e.pointerId]) return;
    ptrs[e.pointerId]=pt(e);
    var ids=Object.keys(ptrs);
    if(pinch&&ids.length>=2){
      var a=ptrs[ids[0]], b=ptrs[ids[1]], d=Math.max(1,Math.hypot(a.x-b.x,a.y-b.y));
      zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/pinch.d); pinch.d=d; e.preventDefault(); return;
    }
    if(nd){
      var p=pt(e), dx=(p.x-nd.p0.x)/z, dy=(p.y-nd.p0.y)/z;
      if(Math.abs(dx)>2||Math.abs(dy)>2) nd.moved=true;
      nd.el.setAttribute("transform","translate("+dx.toFixed(1)+","+dy.toFixed(1)+")");
      nd.nx=nd.x0+dx; nd.ny=nd.y0+dy; e.preventDefault();
    } else if(pan){
      var q=pt(e); tx=pan.tx0+(q.x-pan.p0.x); ty=pan.ty0+(q.y-pan.p0.y); apply(); e.preventDefault();
    }
  });
  function end(e){
    delete ptrs[e.pointerId];
    if(Object.keys(ptrs).length<2) pinch=null;
    if(nd){
      var d=nd; nd=null;
      if(d.moved){
        var grp=curGroup(); grp.pos[d.id]={x:Math.round(d.nx||d.x0),y:Math.round(d.ny||d.y0)};
        save(1); renderKeep();
      } else { d.el.setAttribute("transform",""); r.focus=d.id; renderKeep() }
    }
    pan=null;
  }
  svg.addEventListener("pointerup",end);
  svg.addEventListener("pointercancel",end);
}
